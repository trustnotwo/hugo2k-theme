# Looks a visitor can pick in Display Properties > Appearance (and params.style picks the default).
# base: which library draws the windows (98 = 98.css)
# files: stylesheets from assets/css/, layered after theme.css in this order
# chrome: the static/skins/<name>/ image set its windows use (drawn in the Display Properties preview)
# icons: an icon set from static/skins/<set>-icons/ used instead of static/icons/ (missing names fall back)
# pv: colours for the little preview in Display Properties
- id: "2000"
  name: Windows 2000
  group: Windows
  base: "98"
  files: [classic, skins/2000]
  pv: { desktop: "#3a6ea5", face: "#d4d0c8", a: "#0a246a", b: "#a6caf0", ia: "#808080", ib: "#c0c0c0", window: "#fff", text: "#000" }
- id: "98"
  name: Windows 98
  group: Windows
  base: "98"
  files: [classic, skins/98]
  pv: { desktop: "#008080", face: "#c0c0c0", a: "#000080", b: "#1084d0", ia: "#808080", ib: "#b5b5b5", window: "#fff", text: "#000" }
- id: dark
  name: Windows 2000 (dark)
  group: Windows
  base: "98"
  dark: true
  files: [classic, skins/2000, skins/dark, skins/dark-icons]
  pv: { desktop: "#1d2a3a", face: "#2d2d30", a: "#1e3a66", b: "#3f6aa8", ia: "#3a3a3e", ib: "#4c4c52", window: "#1e1e1e", text: "#d8d8d8" }
- id: zune
  name: Windows XP Zune
  group: Windows
  base: "98"
  chrome: zune
  icons: xp
  files: [classic, skins/xp-shared, skins/zune]
  pv: { desktop: "#1e1e1e", face: "#f4f4f4", a: "#1b1b1b", b: "#5f5f5f", ia: "#252525", ib: "#464646", window: "#fff", text: "#000" }
- id: royale-noir
