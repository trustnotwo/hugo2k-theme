# Looks a visitor can pick in Display Properties > Appearance (and params.style picks the default).
# base: which library draws the windows (98 = 98.css)
# files: stylesheets from assets/css/, layered after theme.css in this order
# chrome: the static/skins/<name>/ image set its windows use (drawn in the Display Properties preview)
# icons: an icon set from static/skins/<set>-icons/ used instead of static/icons/ (missing names fall back)
# pv: colours for the little preview in Display Properties
- id: "2000"
  name: Windows 2000
  group: Windows
  base: "98"
  files: [classic, skins/2000]
  pv: { desktop: "#3a6ea5", face: "#d4d0c8", a: "#0a246a", b: "#a6caf0", ia: "#808080", ib: "#c0c0c0", window: "#fff", text: "#000" }
- id: "98"
  name: Windows 98
  group: Windows
  base: "98"
