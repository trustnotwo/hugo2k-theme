{{- /* Usage: partial "titlebar.html" (dict "title" "..." "icon" "document" "dialog" false) */ -}}
<div class="title-bar">
  <div class="title-bar-text">
    <img src="{{ partial "icon-url.html" (dict "name" (.icon | default "document") "size" 16) }}" alt="" width="16" height="16">
    <span class="title-bar-label">{{ .title }}</span>
  </div>
  <div class="title-bar-controls">
    {{- if not .dialog }}
    <button type="button" aria-label="Minimize"></button>
    <button type="button" aria-label="Maximize"></button>
    {{- end }}
    <button type="button" aria-label="Close"></button>
  </div>
</div>
